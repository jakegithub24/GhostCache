<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Register Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <h1>Admin Registration</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username</label><input name="username" required><br>
      <label>Password</label><input type="password" name="password" required><br>
      <label>Destruction password</label><input type="password" name="d_password" required><br>
      <label>Master key</label><input type="password" name="master_key" required><br>
      <button type="submit">Create admin account</button>
    </form>
  </body>
</html>
