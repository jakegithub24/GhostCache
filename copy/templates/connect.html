{% extends "base.html" %}

{% block title %}Connect &mdash; GhostCache{% endblock %}

{% block content %}
<h2>Send Connection Request</h2>

<form method="post" action="{{ url_for('send_connection_request') }}">
    <label for="username">Agent username</label>
    <input type="text" name="username" id="username" placeholder="enter exact username" required autofocus>
    <button type="submit">Send Request &rarr;</button>
</form>
{% endblock %}
