{% extends "base.html" %}

{% block title %}Upload File &mdash; GhostCache{% endblock %}

{% block content %}
<h2>Upload &amp; Encrypt File</h2>

<form method="post" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
    <label for="file">Select File</label>
    <input type="file" name="file" id="file" required>

    <label for="expiry_days">Expiry (days)</label>
    <input type="number" name="expiry_days" id="expiry_days" value="30" min="1" max="365">

    <button type="submit">Encrypt &amp; Upload &rarr;</button>
</form>
{% endblock %}
