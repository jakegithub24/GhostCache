{% extends "base.html" %}

{% block title %}Login &mdash; GhostCache{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-logo">
            <span class="auth-logo-mark">[ GHOST ]</span>
            <span class="auth-logo-sub">Secure comms &bull; Authenticate to proceed</span>
        </div>

        <form method="post" action="{{ url_for('login') }}">
            <label for="username">Agent ID</label>
            <input type="text" name="username" id="username" placeholder="username" required autofocus>

            <label for="password">Passphrase</label>
            <input type="password" name="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>

            <button type="submit">Authenticate &rarr;</button>
        </form>

        <p class="auth-footer">
            No account? <a href="{{ url_for('register') }}">Register an agent</a>
        </p>
    </div>
</div>
{% endblock %}
